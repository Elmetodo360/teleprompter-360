<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teleprompter EM360</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#0b0b0d;--panel:#16161a;--line:#2a2a30;--fg:#f3f1ec;--dim:#9a978f;--acc:#e0b04a;--accfg:#1a1408;--gancho:#ffd36a;--btn:#26262c;--btnfg:#f3f1ec;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:6px;padding:4px 8px;padding-top:calc(4px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
header button{flex:0 0 auto}
#sel{flex:1 1 auto;min-width:0;background:var(--btn);color:var(--btnfg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;font-size:12px;height:26px}
button{background:var(--btn);color:var(--btnfg);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:700;font-size:13px;padding:0 6px;height:26px;min-width:26px;cursor:pointer;touch-action:manipulation;line-height:1}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#stage{flex:1 1 auto;position:relative;overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#scroll::-webkit-scrollbar{display:none}
#text{padding:42vh 20px 60vh;max-width:820px;margin:0 auto;font-size:var(--fs,34px);line-height:1.35;font-weight:700;text-wrap:pretty}
#text.mirror{transform:scaleX(-1)}
#text .meta{font-size:.5em;font-weight:400;color:var(--dim);line-height:1.3;margin-bottom:.6em}
#text .cifras{font-size:.55em;font-weight:400;color:var(--acc);line-height:1.35;margin-bottom:1.2em;border-left:3px solid var(--acc);padding-left:.6em}
#text .cifras span{display:block}
#text .gancho{color:var(--gancho);margin:0 0 .9em}
#text .lbl{display:block;font-size:.42em;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:1.1em 0 .25em}
#text p{margin:0 0 .7em;white-space:pre-line}
#text .fin{color:var(--dim);font-size:.6em;font-weight:400;margin-top:2em;text-align:center}
#line{position:absolute;left:0;right:0;top:42vh;height:0;border-top:2px solid var(--acc);opacity:.55;pointer-events:none}
#line::before{content:"";position:absolute;left:6px;top:-7px;border:6px solid transparent;border-left:9px solid var(--acc)}
footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:4px 8px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
footer::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.grp .lab{display:none}
.grp .val{font-size:11px;color:var(--dim);min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
#play{flex:0 0 auto;min-width:36px}
.sep{flex:1 1 auto}
.nav{display:flex;gap:4px;flex:0 0 auto}
@media (max-width:420px){#text{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="app">
<header>
<button id="prev" aria-label="Guion anterior">&#9664;</button>
<select id="sel" aria-label="Elegir guion"></select>
<button id="next" aria-label="Guion siguiente">&#9654;</button>
</header>
<div id="stage">
<div id="scroll"><div id="text"></div></div>
<div id="line"></div>
</div>
<footer>
<button id="play" aria-label="Empezar o pausar">&#9654;</button>
<div class="grp"><span class="lab">Vel.</span><button id="vm" aria-label="Menos velocidad">&minus;</button><span class="val" id="vv">1,0</span><button id="vp" aria-label="Más velocidad">+</button></div>
<div class="grp"><span class="lab">Letra</span><button id="fm" aria-label="Letra más pequeña">A&minus;</button><span class="val" id="fv">34</span><button id="fp" aria-label="Letra más grande">A+</button></div>
<span class="sep"></span>
<div class="nav"><button id="top" aria-label="Al inicio">&#8679;</button><button id="mirror" aria-label="Espejo">&#8644;</button><button id="cif" aria-label="Mostrar u ocultar cifras">#</button></div>
</footer>
</div>
<script>
const G = [{"grupo": "Plan 100K · 12 guiones", "id": "G01", "title": "La cuenta de la servilleta", "meta": ["Publicación: 28 de septiembre · Rodaje: 3.º de la sesión de octubre · Duración orientativa: 55–65 s"], "cifras": [], "gancho": "Has hecho mil euros de caja. ¿Cuánto puedes gastarte tú?", "nota": "escribe 10 € en una servilleta y ve descontando. El resultado del ejemplo es 1,50 €, antes de los conceptos pendientes.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "No me digas mil, que mañana vienen los recibos.\n\nMira esta cuenta. Es un ejemplo, con las ventas ya sin IVA.\n\nDe cada diez euros, tres se van en producto. Tres y medio, en personal. Uno, en alquiler. Y otro, entre luz, gas y otros gastos.\n\nQueda uno y medio.\n\nY todavía tienes que comprobar qué falta: mantenimiento, amortizaciones, intereses… y tu trabajo, si no lo has incluido.\n\nPor eso cerrar un sábado con buena caja da tanta alegría… hasta que llega el lunes.\n\nHaz esta cuenta con tu último mes. Si no sabes cuánto queda, tampoco sabes cuánto puedes sacar sin dejar un agujero.\n\nEscríbeme MI NÚMERO por privado y te paso la plantilla."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "La caja del sábado te está dando una alegría que el lunes te puede quitar»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G02", "title": "Antes de subir la carta", "meta": ["Publicación: 5 de octubre · Rodaje: 2.º de octubre · Duración orientativa: 50–60 s"], "cifras": [], "gancho": "¿Vas a subir un euro toda la carta? Espera. A lo mejor estás tocando el plato equivocado.", "nota": "carta en mano. Señala tres platos como si estuvieras revisándola con el dueño.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Tienes uno que se vende bien y deja margen. Otro que apenas sale. Y otro que pide todo el mundo, pero te tiene la cocina atascada.\n\n¿A los tres les vas a hacer lo mismo?\n\nCoge los cinco que más vendes. Mira cuánto cuestan con los precios de esta semana, cuántas raciones salen de verdad y cuánto trabajo llevan.\n\nA lo mejor hay que subir uno. En otro, ajustar la ración. Y en el tercero, cambiar una elaboración que os complica cada servicio.\n\nSubir precios puede hacer falta. Pero antes quiero saber qué estás intentando arreglar.\n\nPorque cincuenta céntimos puestos a ojo siguen siendo una decisión a ojo.\n\nGuárdalo para cuando te sientes a revisar la carta."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Antes de reimprimir la carta, revisa estos cinco platos»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G03", "title": "El camarero nuevo", "meta": ["Publicación: 12 de octubre · Rodaje: 1.º de octubre · Duración orientativa: 50–60 s"], "cifras": [], "gancho": "Lleva tres días trabajando contigo y ya le has dicho: “Eso deberías saberlo”. ¿Quién se lo enseñó?", "nota": "pausa tras la pregunta inicial. La ironía va contra la mala incorporación, no contra el trabajador.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Entró el lunes. Uno le explicó las mesas. Otro, el TPV. Y el tercero le dijo que aquí las cosas se hacen de otra manera.\n\nLlega el viernes, se equivoca y le cae la bronca.\n\nHombre, nuevo era. Adivino, no.\n\nAntes de ponerlo solo, dale una persona de referencia. Enséñale la carta, deja que practique y comprueba qué sabe hacer sin ayuda.\n\nY al terminar el turno, pregúntale dónde se ha atascado. Ahí vas a descubrir más que diciéndole que espabile.\n\nLuego hablaremos de actitud. Pero primero asegúrate de haberle enseñado el trabajo.\n\nComenta ONBOARDING y te paso el protocolo de incorporación."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Le has dado un delantal y ya esperas que conozca tu restaurante»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G04", "title": "Coste de producto: la cámara también cuenta", "meta": ["Publicación: 19 de octubre · Serie: 1 de 8 · Rodaje: 4.º de octubre · Duración orientativa: 55–70 s"], "cifras": [], "gancho": "Ese pedido que sigue en la cámara te puede estar falseando el coste del mes.", "nota": "muestra la fórmula: (inventario inicial + compras − inventario final) ÷ ventas × 100.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Si divides lo comprado entre lo vendido, estás midiendo compras. Parte de ese género todavía no lo has usado.\n\nPara calcular el consumo necesitas cuatro datos: lo que tenías al empezar, lo que compraste, lo que queda al cerrar y las ventas del periodo.\n\nInventario inicial, más compras, menos inventario final. Eso es el consumo. Lo divides entre las ventas y lo multiplicas por cien.\n\nTodo con el mismo criterio, sin IVA y sin mezclar cocina con bebidas si las estás analizando por separado.\n\n¿Y qué porcentaje es bueno? Depende de tu carta y de tu negocio. Un treinta por ciento no te da un aprobado automático.\n\nPrimero saca tu dato real. Luego compáralo con lo que debería costarte lo que has vendido.\n\nGuarda este vídeo para el próximo inventario."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Calculas el coste de comida sumando facturas? Te falta abrir la cámara»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G05", "title": "Personal: mirar las horas", "meta": ["Publicación: 26 de octubre · Serie: 2 de 8 · Rodaje: 1.º de noviembre · Duración orientativa: 50–60 s"], "cifras": [], "gancho": "A las doce te sobra gente. A las dos estás pidiendo auxilio. Mira el cuadrante.", "nota": "dos columnas visibles: hora y carga de trabajo. Evita presentar el 32 % como frontera universal.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Tienes el mismo equipo en dos momentos que no se parecen en nada.\n\nAntes de decidir si necesitas más o menos plantilla, pon en una hoja las ventas por franjas. Al lado, las horas de trabajo de esas franjas.\n\nY apunta también lo que no sale en los tickets: preparar, recibir pedidos, limpiar, cerrar.\n\nAhora sí: ¿dónde falta cobertura? ¿Dónde coinciden personas sin necesidad? ¿Qué tarea podrías adelantar?\n\nEl porcentaje de personal te avisa de que hay algo que revisar. Pero no te dice por sí solo a quién quitar ni a qué hora ponerlo.\n\nHaz el ejercicio con una semana real. Incluido ese sábado que siempre se os atasca.\n\nComenta CUADRANTE y te paso la hoja por franjas."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Antes de decir “me sobra un camarero”, enséñame a qué hora»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G06", "title": "Producto y personal, juntos", "meta": ["Publicación: 2 de noviembre · Serie: 3 de 8 · Rodaje: 2.º de noviembre · Duración orientativa: 45–60 s"], "cifras": [], "gancho": "De cada cien euros que vendes, sesenta y cinco se van entre comida y personal. ¿Con los otros treinta y cinco llegas?", "nota": "escribe 100 − 65 = 35. Presentarlo como ejemplo, no como diagnóstico de cualquier local.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "De ahí tienen que salir alquiler, suministros, mantenimiento y el resto de gastos. Y tendría que quedar beneficio.\n\nEsa suma de producto y personal se llama prime cost.\n\nTe interesa mirarla junta porque puedes engañarte mirando cada parte por separado.\n\nPor ejemplo: compras algo más elaborado, ahorras horas en cocina, pero sube el coste del producto. ¿Has mejorado? Hay que hacer las dos cuentas.\n\nY al revés: ahorrar en una compra puede salir caro si luego exige muchísimo trabajo.\n\nEse sesenta y cinco del ejemplo no condena un restaurante. Te obliga a mirar si el resto cabe.\n\nSaca tus dos porcentajes del último mes y súmalos. Empieza por ahí."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Has ahorrado en la compra. Ahora mira cuánto te ha costado prepararla»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G07", "title": "El alquiler que tienes que vender", "meta": ["Publicación: 9 de noviembre · Serie: 4 de 8 · Rodaje: 3.º de noviembre · Duración orientativa: 45–60 s"], "cifras": [], "gancho": "Tres mil euros de alquiler. ¿Cuánto tienes que vender para poder pagarlos?", "nota": "cuenta sencilla en pantalla: 3.000 / 30.000 = 10 %; 3.000 / 60.000 = 5 %.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Porque tres mil de caja no bastan. De esa venta también salen género, personal y otros gastos.\n\nSi vendes treinta mil al mes, sin IVA, el alquiler representa un diez por ciento. Si vendes sesenta mil, un cinco.\n\nEl recibo es el mismo. El esfuerzo del negocio, no.\n\nPor eso, antes de enamorarte de un local, calcula qué venta te exige. Y si esa venta cabe de verdad: mesas, ticket, servicios y días abiertos.\n\nSi ya estás dentro y no llegas, pon sobre la mesa las opciones: mejorar ventas con margen, revisar el modelo o plantear una renegociación.\n\nPero con números. “Es que este mes ha ido flojo” explica poco.\n\nPásaselo a quien esté a punto de firmar un local."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Antes de preguntar cuánto cuesta ese local, pregunta cuánto te obliga a vender»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G08", "title": "Mi caso es distinto", "meta": ["Publicación: 16 de noviembre · Rodaje: 4.º de noviembre · Duración orientativa: 45–55 s"], "cifras": [], "gancho": "“En mi restaurante eso no funciona”. Vale. ¿Lo has probado o lo hemos descartado ya?", "nota": "tono de conversación; pregunta final real, sin regañar.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Claro que tu casa tiene sus cosas. El barrio, el cliente, la carta, el equipo.\n\nNo voy a organizar igual un bar de desayunos que un restaurante de degustación.\n\nPero en los dos necesito saber cuánto cuesta servir lo que venden. En los dos alguien tiene que organizar el trabajo. Y en los dos hay que contar lo que se tira.\n\nLuego cambia cómo lo hacemos.\n\nLo que me preocupa es que “mi caso es distinto” acabe significando “vamos a seguir igual”.\n\nSi llevas meses con el mismo problema, elige una cosa. Mídela, cambia algo y comprueba qué pasa.\n\n¿Qué llevas tiempo queriendo cambiar en tu local y nunca llegas a probar?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Tu restaurante es diferente. Eso no impide contar lo que tiras»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G09", "title": "La merluza de 14,80", "meta": ["Publicación: 23 de noviembre · Rodaje: 1.º de diciembre · Duración orientativa: 50–60 s"], "cifras": [], "gancho": "Esa merluza de catorce ochenta te está saliendo a casi veinticinco euros el kilo.", "nota": "mostrar 14,80 € ÷ 60 % = 24,67 €/kg útil. El 60 % es el supuesto del ejemplo.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "La compras entera. La limpias. Y, en este ejemplo, de cada kilo te quedan seiscientos gramos útiles.\n\nDivide catorce ochenta entre cero coma seis: veinticuatro con sesenta y siete.\n\nEse es el coste del kilo aprovechable si no asignas valor a otros aprovechamientos. Antes de añadirle nada al plato.\n\nSi en la ficha has puesto el precio de la factura, la ración empieza mal calculada.\n\nY luego está lo que se estropea, lo que se cae o lo que hay que repetir. Eso también hay que apuntarlo, pero separado. La comida del equipo, registrada como tal.\n\nEmpieza con un producto caro: pésalo al entrar y después de limpiarlo. Mira qué rendimiento te da de verdad.\n\nComenta MERMA y te paso la hoja de control."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Pagas el kilo entero. ¿Por qué calculas como si lo sirvieras entero?»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G10", "title": "Los 84.000 euros", "meta": ["Publicación: 30 de noviembre · Rodaje: 2.º de diciembre · Duración orientativa: 55–65 s"], "cifras": [], "gancho": "Vender ochenta y cuatro mil euros al mes y sacar mil novecientos para ti. ¿Te compensaría?", "nota": "pausa después de 1.900. Rótulo visible: “Ejemplo hipotético · ventas sin IVA”.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Te pongo un ejemplo. No un caso auditado.\n\nUn restaurante vende esos ochenta y cuatro mil, sin IVA. El dueño retira mil novecientos. Solo con eso todavía no sabemos el beneficio: faltan las cuentas.\n\nPero mira lo que pesan siete puntos de coste de producto en ese negocio: cinco mil ochocientos ochenta euros al mes.\n\nSi está consumiendo un treinta y ocho por ciento y su mezcla de ventas permitiría un treinta y uno, hay una diferencia que investigar.\n\nPuede haber raciones, merma, compras, errores de registro… No voy a prometer que todo se recupera.\n\nLo que sí digo es que, con esa venta, cada punto importa mucho.\n\nSi te reconoces en vender mucho y no saber qué queda, escríbeme AUDITORÍA."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Con ochenta y cuatro mil euros de venta, un solo punto son ochocientos cuarenta euros»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G11", "title": "El TPV que solo usas para cobrar", "meta": ["Publicación: 7 de diciembre · Rodaje: 3.º de diciembre · Duración orientativa: 45–55 s"], "cifras": [], "gancho": "Tu TPV sabe cuál es tu plato más vendido. ¿Tú sabes cuánto te deja?", "nota": "informe sin datos de clientes. No atribuir al TPV información de costes si no está integrada.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Porque son dos preguntas distintas.\n\nSaca la venta por artículos y crúzala con tus escandallos actualizados. Ahí puedes ver qué platos venden mucho y qué margen de producto aportan.\n\nDespués mira las ventas por horas. ¿Tu cuadrante sigue ese ritmo o llevas meses copiando la misma semana?\n\nY, por último, el ticket medio. ¿Está cambiando porque subiste precios, porque piden más o porque viene otro tipo de cliente?\n\nEmpieza por comprobar qué informes o exportaciones permite tu TPV. A lo mejor tienes los datos y lo que falta es sentarte con ellos.\n\nComenta TPV y te digo qué tres informes pedir."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Antes de pagar otra herramienta, mira lo que ya tienes en el TPV»."}]}, {"grupo": "Plan 100K · 12 guiones", "id": "G12", "title": "En enero me pongo", "meta": ["Publicación: 14 de diciembre · Rodaje: 4.º de diciembre · Duración orientativa: 45–60 s"], "cifras": [], "gancho": "“En enero miro los números”. ¿Y si esperar te cuesta dos mil euros al mes?", "nota": "sin reproche. Rótulo: “Ejemplo: 50.000 € × 4 % = 2.000 €/mes”.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Te entiendo. Hoy falta uno. Mañana se rompe algo. Pasado tienes un grupo. Siempre hay algo que atender antes de sentarte.\n\nPero haz una cuenta conmigo.\n\nSi vendes cincuenta mil al mes, sin IVA, y estás perdiendo cuatro puntos de margen que podrías recuperar, hablamos de dos mil euros al mes.\n\nTres meses serían seis mil.\n\nEs un ejemplo. Tu cifra puede ser otra. Precisamente por eso hay que mirarla.\n\nNo te estoy diciendo que reorganices el restaurante esta noche. Empieza por algo que puedas terminar: revisar tus cinco platos más vendidos o contar lo que se tira esta semana.\n\n¿Qué vas a mirar primero?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Llevas meses esperando una semana tranquila para revisar el negocio. ¿Cuándo fue la última?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J1", "title": "Cinco personas y los platos no salen", "meta": ["Duración orientativa: 45–55 s"], "cifras": [], "gancho": "Cinco personas trabajando y una mesa esperando sus huevos. ¿Qué está pasando ahí dentro?", "nota": "escena ilustrativa. Si recuperas el mensaje original de Zaragoza, puedes presentarlo como consulta real anonimizada; esta versión no lo necesita.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Imagina un brunch: tres en cocina, dos en barra. Entran comandas, salen cafés, alguien pregunta por la mesa cuatro y nadie sabe qué le falta.\n\nUno ha empezado los huevos. Otro espera el pan. Y el plato que ya está listo se queda enfriando.\n\nAntes de contratar a una sexta persona, mira dónde se atasca el pedido.\n\nQuién ordena la salida. Quién monta. Quién comprueba que está completo. Y quién lo lleva.\n\nPuede que falte personal. Pero el número de personas, por sí solo, no te lo dice.\n\nCoge una comanda del último servicio malo y sigue su recorrido. ¿En qué momento dejó de avanzar?\n\nCuéntame dónde se os atasca a vosotros."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Los huevos están. El pan también. ¿Por qué sigue esperando la mesa cuatro?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J2", "title": "El plato estrella", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "Como tu plato más vendido esté mal calculado, lo repites cincuenta veces cada sábado.", "nota": "plato real y ficha al lado. No afirmar pérdidas sin haber calculado el margen.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Y tú encantado, porque sale muchísimo.\n\nPero el precio lo pusiste hace un año. La carne ha cambiado de tarifa, la guarnición ha crecido y la salsa ya no se hace como en la ficha.\n\nSigues vendiendo el mismo nombre. El coste puede ser otro.\n\nEsta semana coge tus cinco platos más vendidos. Usa las últimas facturas, pesa una ración real y actualiza el escandallo.\n\nA lo mejor están bien. Perfecto. Pero como uno esté dejando mucho menos de lo que creías, te interesa enterarte antes del próximo sábado.\n\nEmpieza por el que más sale. Ahí cualquier diferencia se repite muchas veces."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Tu plato estrella te deja dinero o simplemente te da mucho trabajo?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J3", "title": "Cobra todo el mundo menos tú", "meta": ["Duración orientativa: 45–55 s"], "cifras": [], "gancho": "Cobra el proveedor. Cobra el equipo. Cobra el casero. Y tú, si queda.", "nota": "tono sereno. Remuneración, beneficio y efectivo disponible son conceptos diferentes.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "¿Te suena?\n\nPuedes vender cuarenta mil euros al mes y seguir trabajando sin asignarte una remuneración.\n\nEntonces llega fin de mes, ves algo en la cuenta y dices: “Bueno, hemos ganado”.\n\nEspera. ¿Tu trabajo está pagado en esa cuenta?\n\nHaz un ejercicio: cuánto costaría poner a otra persona a hacer tus turnos y tus tareas. Inclúyelo al analizar el negocio.\n\nA partir de ahí, revisa dónde falta margen y dónde se está yendo el dinero. Puede ser producto, estructura o pagos que no coinciden con el mes.\n\nPero no des por rentable un restaurante porque tú trabajas gratis.\n\nHabla de esta cuenta con tu socio. Conviene que los dos estéis mirando lo mismo."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Tu restaurante sale rentable… hasta que pones precio a tus horas»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J4", "title": "El local que factura menos", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "El bar de al lado factura menos que tú. Y puede estar ganando más.", "nota": "rótulo “Ejemplo hipotético”. Se elimina la atribución a Bilbao y las cifras pendientes del original.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Te pongo un ejemplo sencillo.\n\nUn local vende un millón al año y obtiene un tres por ciento de beneficio: treinta mil euros.\n\nOtro vende medio millón y obtiene un doce por ciento: sesenta mil.\n\nLa mitad de venta. El doble de beneficio. Con el mismo criterio de gastos en las dos cuentas, incluido el trabajo del dueño.\n\nPor eso, cuando alguien me dice “quiero abrir otro”, quiero ver antes cuánto deja el primero y qué necesita para funcionar.\n\nPorque abrir otro local también multiplica alquileres, decisiones y problemas pendientes.\n\nAntes de pensar cuántos restaurantes quieres, decide cuánto quieres ganar con ellos."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Quieres facturar el doble o ganar más? Antes de abrir otro local, haz esta cuenta»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J5", "title": "La queja que empeoraste tú", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "El filete salió pasado. La discusión de diez minutos la pusiste tú.", "nota": "cuenta la escena, sin imitar al cliente de forma despectiva.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "El cliente te lo dice y empieza el interrogatorio: que si lo pidió así, que si ya ha comido la mitad, que si en cocina dicen que estaba bien.\n\nMientras tanto, tiene el plato delante y sigue sin comer a gusto.\n\nAcércate. Escucha qué ha pasado. Ofrece una solución concreta y di cuánto va a tardar.\n\nDespués comprueba si se ha resuelto. No desaparezcas en cuanto te llevas el plato.\n\nHabrá quejas injustas, claro. Pero una queja normal no necesita que ganes la discusión. Necesita que alguien se haga cargo.\n\nComéntalo hoy con tu equipo: ¿qué puede resolver cada uno sin venir a buscarte?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Un plato se puede repetir. Lo que le dijiste al cliente ya lo ha oído»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J6", "title": "El cliente invisible", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "Hay un cliente en la puerta. Lo habéis visto tres. No lo ha saludado ninguno.", "nota": "comenzar mirando un segundo hacia una puerta imaginaria y volver a cámara.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Uno lleva platos. Otro está cobrando. El tercero piensa que ya se encarga alguien.\n\nY el cliente ahí, sin saber si tiene que esperar, entrar o irse.\n\nNo hace falta dejar una bandeja en el suelo. Muchas veces basta con mirarlo y decirle: “Buenas, enseguida estoy contigo”. Y después cumplirlo.\n\nAntes del servicio, dejad claro quién recibe y quién lo cubre cuando está ocupado.\n\nParece una tontería hasta que te pasa a ti: entras en un sitio, nadie te mira y ya empiezas incómodo.\n\nHoy observa la puerta cinco minutos. Te va a contar cosas del servicio que desde la barra no ves."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Antes de que pruebe la comida, ya lo habéis dejado plantado en la puerta»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J7", "title": "El menú de catorce euros", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "En los dos bares el menú cuesta catorce euros. En uno, cuando entras, ya saben cómo tomas el café.", "nota": "cercano, con una sonrisa leve. Evitar tono de lección de hospitalidad.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "No es lo único que decide dónde comes. Pero cuenta.\n\nComida buena, servicio ágil, precio razonable… Y además alguien se acuerda de ti.\n\nQue te pregunten si tienes prisa. Que recuerden la mesa que te gusta. Que no tengas que pedir el mismo vaso de agua cada día.\n\nSon detalles pequeños, pero el cliente los nota.\n\nEso sí: sin confianza forzada, sin invadir y sin dar nada por supuesto con alergias o necesidades alimentarias. Eso se confirma y se gestiona bien.\n\nPiensa en tus habituales. ¿Qué sabe tu equipo de ellos, aparte de lo que suelen gastar?\n\nAhí tienes una conversación para antes del servicio."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Tus habituales vuelven por el menú o también por cómo los recibís?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J8", "title": "El ratio que mejora por arte de magia", "meta": ["Duración orientativa: 45–55 s"], "cifras": [], "gancho": "Has sacado tu sueldo del coste de personal. El porcentaje ha mejorado. En el banco hay lo mismo.", "nota": "dos columnas y el mismo importe moviéndose entre ellas. Sin presentar reclasificación como ahorro.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Puedes separar gestión y operación para entender mejor las cuentas. Pero mover un coste de columna no hace que desaparezca.\n\nSi trabajas en el restaurante, ese trabajo tiene un coste. Y si comparas meses, tienes que mantener el mismo criterio.\n\nPara revisar personal, cuenta remuneraciones, coste de empresa de la Seguridad Social y el resto de costes laborales que correspondan. Compáralos con las ventas sin IVA.\n\nY si quieres mirar solo el equipo operativo, perfecto: separa la gestión, pero enséñala también.\n\nLo que no vale es decir que has ahorrado porque ahora una parte está en otra pestaña.\n\nRevisa eso antes de celebrar que el ratio ha bajado."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Bajar un porcentaje en Excel no siempre significa gastar menos»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J9", "title": "Queremos más ventas", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "“Estamos llenos y no llegamos. Vamos a meter publicidad”. Espera: ¿dónde vas a sentar a los que vengan?", "nota": "situación ilustrativa, sin atribuirla al asador de Burgos sin recuperar la consulta.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Si el problema es el viernes por la noche, meter más gente puede complicar un servicio que ya va justo.\n\nA lo mejor necesitas llenar el martes. O mejorar lo que deja cada mesa. O dejar de gastar tanto para servir lo que ya vendes.\n\nAntes de lanzar una campaña, decide qué servicio quieres mover, cuánta capacidad tienes y qué margen deja esa venta adicional.\n\nLa publicidad puede ayudar. Pero dale un trabajo concreto.\n\n“Vender más” es demasiado amplio. “Llenar diez mesas el martes con una oferta que deja margen” ya te permite hacer cuentas.\n\n¿Qué servicio de tu semana necesita realmente más clientes?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Necesitas más clientes o necesitas que los que ya tienes dejen más margen?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J10", "title": "Lo que cabe en un cubo", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "¿Tirarías un billete de veinte euros? Pues ponle precio a lo que has tirado hoy en cocina.", "nota": "hoja y recipiente limpio como apoyo. No afirmar que tú perdiste 1.200 € si no está documentado.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "El pan que sobró. La nata que se quedó abierta. Esa preparación que hiciste de más “por si acaso”.\n\nPor separado parece poco. Junto, hay que verlo.\n\nPon una hoja donde se tira el producto. Apuntad qué era, cuánto, por qué y su coste.\n\nSin montar una bronca cada vez que alguien anota algo. Como apuntarlo traiga problemas, la hoja se queda limpia y el cubo sigue lleno.\n\nAl final de la semana mira qué se repite. Y corrige una causa: compra, conservación o cantidad preparada.\n\nAntes de pedir al proveedor que te baje veinte euros, mira cuántos acaban en la basura."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Como riñas al que apunta la merma, vas a conseguir una hoja vacía»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J11", "title": "El proveedor de toda la vida", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "“Es mi proveedor de toda la vida”. Bien. ¿Cuándo comparaste su precio por última vez?", "nota": "dos ofertas anonimizadas o ficticias claramente rotuladas.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Tener confianza vale mucho. Que responda cuando falla algo, también.\n\nPero puedes valorar eso y revisar lo que estás pagando.\n\nCoge uno de los productos que más compras y pide otra oferta. Del mismo producto: calidad, corte, calibre, formato, entrega. Que luego comparamos cosas distintas y celebramos un ahorro que no existe.\n\nY mira el rendimiento. El más barato por kilo puede dejarte menos raciones.\n\nCon eso delante, habla con tu proveedor. Puede que siga siendo la mejor opción. O puede que haya algo que revisar.\n\nLa relación de años no debería impedir una conversación sobre precios."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Ese producto más barato, ¿te está dando las mismas raciones?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J12", "title": "La caja cuadró", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "La caja cuadró al céntimo. De si ganaste dinero, todavía no sabemos nada.", "nota": "hoja breve. No vender este registro como una cuenta diaria exacta de resultados.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Cerrar caja te confirma que los cobros encajan. Para saber qué deja el negocio hacen falta más cuentas.\n\nPero puedes empezar esta noche con un registro sencillo: ventas, horas trabajadas, desperdicio e incidencias importantes.\n\nEl pedido que llegó lo registras también. Lo que no haces es tratar todo lo comprado hoy como si te lo hubieras comido hoy.\n\nCon ese seguimiento detectas días raros y preguntas mejor: por qué hubo tantas horas, qué se repitió, qué se tiró.\n\nDespués cierras el mes con inventario y gastos completos.\n\nGuarda el vídeo y prueba esta noche. Que la caja cuadre está bien. Ahora toca entender el servicio."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Cierras caja o estás calculando beneficio? Porque no es la misma cuenta»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J13", "title": "El descanso pendiente", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "“Descansamos cuando baje el trabajo”. ¿Eso cuándo es, exactamente?", "nota": "se sustituye la comparación con Chick-fil-A por una escena propia del sector sin estadísticas externas.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Porque después del puente viene un grupo. Luego una baja. Luego la terraza.\n\nY si el descanso depende de que no pase nada, nunca llega el día.\n\nCuando hagas el cuadrante, cuenta también con que la gente necesita recuperarse y organizar su vida.\n\nPublica con antelación, reduce los cambios de última hora y revisa qué servicios te obligan siempre a tirar de los mismos.\n\nPuede que falte cobertura. Puede que estés abriendo una franja que apenas aporta. Hay que mirarlo.\n\nLo que no puedes hacer es presupuestar el mes suponiendo que todos van a aguantar un poco más.\n\nMira el próximo cuadrante: ¿se sostiene o vuelve a depender de favores?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Tu cuadrante funciona o funciona porque siempre hay alguien que te hace un favor?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J14", "title": "El primer viernes del nuevo", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "Primera noche. Restaurante lleno. “Tú pregunta lo que no sepas”. ¿A quién? Si vais todos corriendo.", "nota": "sin referencia a las cuatro semanas de Mercadona, no acreditadas en el original.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "El nuevo mira el TPV, busca la mesa, pregunta por una salsa… y cada duda llega en el peor momento.\n\nAntes de ese servicio, enséñale lo básico del puesto. Que practique una comanda. Que localice las mesas. Que sepa qué dudas tiene que consultar y con quién.\n\nY esa noche asígnale un trabajo que pueda hacer con apoyo. Ya habrá tiempo de ampliarlo.\n\nNo todos necesitan los mismos días. Comprueba lo que sabe hacer, no solo cuánto lleva contratado.\n\nSi el viernes va a ser complicado, su preparación empieza antes del viernes.\n\nGuárdalo para la próxima incorporación."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Le has dicho que pregunte. No le has dejado a nadie disponible para responder»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J15", "title": "La pregunta que ayuda a vender", "meta": ["Duración orientativa: 35–45 s"], "cifras": [], "gancho": "“¿Algo más?” es la pregunta que haces cuando ya no sabes qué ofrecer.", "nota": "sustituye la anécdota de Trader Joe's sin atribuirle resultados económicos no acreditados.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Tienes una mesa mirando la carta. En vez de soltarla por costumbre, entiende qué necesitan.\n\n“¿Vais a compartir?”. “¿Tenéis prisa?”. “¿Queréis algo para picar mientras elegís?”.\n\nLa respuesta te permite recomendar con sentido. A lo mejor necesitan un entrante rápido. A lo mejor ya han pedido de sobra.\n\nNo se trata de colocarle otra ración a quien no la quiere. Se trata de que el camarero conozca la carta y ayude a decidir.\n\nAntes del servicio, elegid una recomendación útil y explicad cuándo ofrecerla.\n\n¿Qué pregunta os ayuda de verdad a atender mejor una mesa?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Tu camarero conoce la carta. ¿Sabe qué recomendar y a quién?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J16", "title": "Ya vendrá otro", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "“Si se va, ya vendrá otro”. Sí. Y hasta que aprenda, ¿quién hace su trabajo?", "nota": "no usar el 60 % de rotación ni un coste fijo por sustitución sin datos propios.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Tú haciendo entrevistas. El encargado enseñando. El equipo cubriendo el hueco.\n\nLuego llegan las dudas, los errores de aprendizaje y las semanas hasta que esa persona puede trabajar con autonomía.\n\nPonle horas y coste a todo eso. Aunque no recibas una factura que diga “cambio de camarero”.\n\nNo todas las salidas se pueden evitar. Y a veces cambiar es necesario.\n\nPero si se te va gente por el mismo motivo una y otra vez, contratar es solo volver al principio.\n\nPregunta por qué se van. Y comprueba si estás haciendo algo para corregirlo.\n\nHabla de esto antes de publicar otra vez la misma oferta."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Cuántas veces has publicado este año la misma oferta de camarero?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J17", "title": "Cinco voces en el pase", "meta": ["Duración orientativa: 35–45 s"], "cifras": [], "gancho": "Si cinco personas cantan comandas a la vez, a la sexta ya no la escucha nadie.", "nota": "se retira la escena no identificada de The Bear. El conflicto se entiende sin recurrir a la serie.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Uno pregunta por la ocho. Otro adelanta la doce. Sala reclama la cuatro y cocina empieza tres cosas que todavía no hacían falta.\n\nAl final todos corren y nadie sabe qué sale primero.\n\nAntes del servicio, dejad claro quién ordena el pase, cómo se comunican los cambios y quién confirma lo que falta.\n\nY mantenedlo cuando venga el lío. Porque si cada urgencia cambia el orden por su cuenta, volvéis al principio.\n\nPrueba a observar un servicio: ¿cuántas personas están dando instrucciones distintas sobre la misma comanda?\n\nAhí tienes algo concreto que corregir mañana."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Quién manda en tu pase cuando empiezan las prisas?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J18", "title": "El cliente que levanta la voz", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "Un cliente levanta la voz y tu camarero nuevo te busca con la mirada. ¿Sabe que vas a ayudarle?", "nota": "firme, sin convertir al cliente en enemigo ni prometer resolver cualquier conflicto.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Esa respuesta debería tenerla antes de que pase.\n\nEl equipo necesita saber quién se hace cargo, qué puede resolver cada persona y cuándo tiene que avisar.\n\nPrimero, escuchar el problema sin entrar al choque. Después, ofrecer una solución que pueda cumplir. Y si la situación escala, que intervenga el responsable.\n\nAtender una queja no obliga a aguantar insultos. Ese límite también tiene que estar claro.\n\nNo le digas simplemente “ten paciencia”. Explícale qué hacer y respáldalo cuando lo haga.\n\nAntes del próximo servicio, dedica cinco minutos a una pregunta: ¿qué hacemos aquí cuando un cliente se pone así?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "“Ten paciencia” no es suficiente cuando están gritando a tu camarero»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J19", "title": "Depende de quién esté", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "“Aquí se come muy bien… depende de quién esté”. Esa segunda parte te debería preocupar.", "nota": "el problema es la dependencia, no señalar o ridiculizar a un cocinero.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "El martes, una ración. El sábado, otra. Con uno sale rápido; con otro, cada mesa espera algo distinto.\n\nY el cliente no sabe a quién le tocaba trabajar. Solo sabe que la última vez estuvo mejor.\n\nEmpieza por lo que más se repite: tus platos más vendidos, la preparación antes de abrir y la organización del pase.\n\nDeja claro cómo deben salir y compruébalo en servicios distintos. No basta con escribir una ficha y guardarla.\n\nSi algo solo funciona cuando está una persona concreta, identifica qué hace esa persona y enséñaselo al resto.\n\n¿Qué cambia demasiado en tu restaurante según quién esté de turno?"}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "El cliente ha recomendado tu restaurante. Ahora cruza los dedos para que esté el cocinero bueno»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J20", "title": "Al bueno le cae otra mesa", "meta": ["Duración orientativa: 40–50 s"], "cifras": [], "gancho": "Tu mejor camarero termina sus mesas. ¿Y qué premio tiene? Las del que no ha hecho su parte.", "nota": "tono reflexivo. Sin etiquetar a personas como “flojos” ni negar el papel del sueldo en la retención.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Un día, normal. Nos ayudamos todos.\n\nPero todos los días, con la misma persona, ya es otra cosa.\n\nEl que cumple empieza a entender que cuanto mejor trabaja, más trabajo le cae. Y que tú lo ves, pero no intervienes.\n\nMira qué está pasando con quien no llega. Puede faltarle formación, puede estar mal organizado o puede no estar cumpliendo. No se corrige todo de la misma manera.\n\nHabla con hechos, acuerda qué tiene que cambiar y haz seguimiento.\n\nTu mejor trabajador también necesita ver que repartes la carga con criterio.\n\nQue sea bueno no significa que pueda con todo."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "¿Estás cuidando al que más trabaja o te estás acostumbrando a que lo saque todo?»."}]}, {"grupo": "Julio · 21 guiones actualizados", "id": "J21", "title": "El porcentaje que bajó", "meta": ["Duración orientativa: 45–55 s"], "cifras": [], "gancho": "Bajar personal del treinta y ocho al treinta y uno por ciento suena bien. Ahora dime cómo ha bajado.", "nota": "los porcentajes se usan como situación a analizar, sin afirmar un caso real del norte no documentado.", "blocks": [{"t": "", "b": "Texto a cámara", "x": "Porque puede haber más ventas con las mismas horas. Puede haber menos gasto. O puede que hayas movido la gestión a otra partida.\n\nEl porcentaje baja en los tres casos. No significa lo mismo.\n\nCuando compares, mira euros, horas, ventas y calidad del servicio. Con el mismo criterio en ambos periodos.\n\nSi has ajustado solapes sin dejar el pase descubierto, hay una mejora que medir. Si simplemente trabajas tú todas las horas que faltan, inclúyelas en la cuenta.\n\nY si solo has cambiado un coste de sitio, no lo presentes como ahorro.\n\nAntes de celebrar un porcentaje, comprueba qué ha cambiado realmente en el restaurante."}, {"t": "", "b": "Gancho alternativo · segunda entrada, no se lee seguido", "x": "Tu ratio de personal ha bajado. ¿También ha bajado el trabajo que haces tú gratis?»."}]}];
const $ = id => document.getElementById(id);
const scroll = $("scroll"), text = $("text");
let cur = 0, playing = false, speed = 1.0, fs = 34, mirror = false, showCif = true, raf = null, last = 0, acc = 0;
const load = (k, d) => { try { const v = localStorage.getItem("tp_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem("tp_" + k, JSON.stringify(v)); } catch (e) {} };
speed = load("speed", 1.0); fs = load("fs", 34); mirror = load("mirror", false); showCif = load("cif", true); cur = Math.min(load("cur", 0), G.length - 1);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function fillSel() {
  let g = null, html = "";
  G.forEach((s, i) => { if (s.grupo !== g) { if (g) html += "</optgroup>"; g = s.grupo; html += '<optgroup label="' + esc(g) + '">'; } html += '<option value="' + i + '">' + esc(s.id + " · " + s.title) + "</option>"; });
  html += "</optgroup>"; $("sel").innerHTML = html;
}
function render() {
  const s = G[cur]; let h = "";
  h += '<div class="meta">' + esc(s.id + " · " + s.title) + (s.meta.length ? "<br>" + esc(s.meta.join(" · ")) : "") + (s.nota ? "<br>Rodaje: " + esc(s.nota) : "") + "</div>";
  if (showCif && s.cifras.length) h += '<div class="cifras">' + s.cifras.map(c => "<span>" + esc(c) + "</span>").join("") + "</div>";
  if (s.gancho) h += '<span class="lbl">Gancho</span><p class="gancho">' + esc(s.gancho) + "</p>";
  s.blocks.forEach(b => { h += '<span class="lbl">' + esc((b.t ? b.t + " · " : "") + b.b) + "</span><p>" + esc(b.x) + "</p>"; });
  h += '<p class="fin">Fin · ' + esc(s.id) + "</p>";
  text.innerHTML = h; text.style.setProperty("--fs", fs + "px"); text.classList.toggle("mirror", mirror);
  $("sel").value = cur; scroll.scrollTop = 0; save("cur", cur);
  $("vv").textContent = speed.toFixed(1).replace(".", ","); $("fv").textContent = fs;
  $("mirror").classList.toggle("on", mirror); $("cif").classList.toggle("on", showCif);
}
function step(ts) {
  if (!playing) return;
  if (last) { acc += (ts - last) / 1000 * speed * 55; const px = Math.floor(acc); if (px) { scroll.scrollTop += px; acc -= px; } }
  last = ts;
  if (scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 2) { setPlay(false); return; }
  raf = requestAnimationFrame(step);
}
function setPlay(p) { playing = p; last = 0; acc = 0; $("play").classList.toggle("on", p); $("play").innerHTML = p ? "&#10074;&#10074;" : "&#9654;"; if (p) raf = requestAnimationFrame(step); else if (raf) cancelAnimationFrame(raf); }
function go(i) { setPlay(false); cur = (i + G.length) % G.length; render(); }
$("play").onclick = () => setPlay(!playing);
scroll.addEventListener("click", () => setPlay(!playing));
$("vm").onclick = () => { speed = Math.max(0.2, +(speed - 0.1).toFixed(1)); save("speed", speed); $("vv").textContent = speed.toFixed(1).replace(".", ","); };
$("vp").onclick = () => { speed = Math.min(4, +(speed + 0.1).toFixed(1)); save("speed", speed); $("vv").textContent = speed.toFixed(1).replace(".", ","); };
$("fm").onclick = () => { fs = Math.max(18, fs - 2); save("fs", fs); text.style.setProperty("--fs", fs + "px"); $("fv").textContent = fs; };
$("fp").onclick = () => { fs = Math.min(72, fs + 2); save("fs", fs); text.style.setProperty("--fs", fs + "px"); $("fv").textContent = fs; };
$("top").onclick = () => { setPlay(false); scroll.scrollTop = 0; };
$("mirror").onclick = () => { mirror = !mirror; save("mirror", mirror); text.classList.toggle("mirror", mirror); $("mirror").classList.toggle("on", mirror); };
$("cif").onclick = () => { showCif = !showCif; save("cif", showCif); render(); };
$("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
$("sel").onchange = e => go(+e.target.value);
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); setPlay(!playing); } if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); if (e.key === "ArrowUp") $("vp").click(); if (e.key === "ArrowDown") $("vm").click(); });
let wl = null; async function lock() { try { if (navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch (e) {} }
document.addEventListener("click", lock, { once: true }); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") lock(); });
fillSel(); render();
</script>
