<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teleprompter EM360</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#0b0b0d;--panel:#16161a;--line:#2a2a30;--fg:#f3f1ec;--dim:#9a978f;--acc:#e0b04a;--accfg:#1a1408;--gancho:#ffd36a;--btn:#26262c;--btnfg:#f3f1ec;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
header button{flex:0 0 auto}
#sel{flex:1 1 auto;min-width:0;background:var(--btn);color:var(--btnfg);border:1px solid var(--line);border-radius:8px;padding:10px 8px;font:inherit;font-size:15px}
button{background:var(--btn);color:var(--btnfg);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:700;font-size:17px;padding:10px 12px;min-width:46px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#stage{flex:1 1 auto;position:relative;overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#scroll::-webkit-scrollbar{display:none}
#text{padding:45vh 20px 60vh;max-width:820px;margin:0 auto;font-size:var(--fs,34px);line-height:1.35;font-weight:700;text-wrap:pretty}
#text.mirror{transform:scaleX(-1)}
#text .meta{font-size:.5em;font-weight:400;color:var(--dim);line-height:1.3;margin-bottom:.6em}
#text .cifras{font-size:.55em;font-weight:400;color:var(--acc);line-height:1.35;margin-bottom:1.2em;border-left:3px solid var(--acc);padding-left:.6em}
#text .cifras span{display:block}
#text .gancho{color:var(--gancho);margin:0 0 .9em}
#text .lbl{display:block;font-size:.42em;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:1.1em 0 .25em}
#text p{margin:0 0 .7em;white-space:pre-line}
#text .fin{color:var(--dim);font-size:.6em;font-weight:400;margin-top:2em;text-align:center}
#line{position:absolute;left:0;right:0;top:45vh;height:0;border-top:2px solid var(--acc);opacity:.55;pointer-events:none}
#line::before{content:"";position:absolute;left:6px;top:-7px;border:6px solid transparent;border-left:9px solid var(--acc)}
footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{display:flex;align-items:center;gap:6px}
.grp .lab{font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;min-width:34px}
.grp .val{font-size:14px;color:var(--fg);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.grp button{flex:1 1 auto}
#play{grid-column:1 / -1;font-size:20px;padding:14px}
.nav{display:flex;gap:8px;grid-column:1 / -1}
.nav button{flex:1}
@media (max-width:420px){button{font-size:16px;padding:9px 8px;min-width:40px}#text{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="app">
<header>
<button id="prev" aria-label="Guion anterior">&#9664;</button>
<select id="sel" aria-label="Elegir guion"></select>
<button id="next" aria-label="Guion siguiente">&#9654;</button>
</header>
<div id="stage">
<div id="scroll"><div id="text"></div></div>
<div id="line"></div>
</div>
<footer>
<button id="play">&#9654;&nbsp; Empezar</button>
<div class="grp"><span class="lab">Vel.</span><button id="vm">&minus;</button><span class="val" id="vv">1,0</span><button id="vp">+</button></div>
<div class="grp"><span class="lab">Letra</span><button id="fm">A&minus;</button><span class="val" id="fv">34</span><button id="fp">A+</button></div>
<div class="nav"><button id="top">&#8679; Al inicio</button><button id="mirror">Espejo</button><button id="cif">Cifras</button></div>
</footer>
</div>
<script>
const G = [{"grupo": "Plan 100K · octubre", "id": "G01", "title": "La cuenta de la servilleta", "meta": ["OCTUBRE - se publica el lunes 28 de septiembre a las 11:30", "Duración: 60 s - Pilar: Costes y márgenes", "Orden de rodaje: 3.º de la sesión"], "cifras": ["10 € entran por caja", "3,00 materia prima", "3,50 personal (con SS)", "1,00 alquiler", "1,00 suministros y gestoría", "QUEDA 1 €"], "gancho": "De cada diez euros que entran por tu caja, cuántos son tuyos? Te lo calculo en un minuto.", "nota": "Mirando a lente. Sin intro, sin saludo.", "blocks": [{"t": "3-45 s", "b": "LA CUENTA", "x": "Entran diez euros.\nTres se van en materia prima, si lo tienes bien. Quedan siete.\nTres y medio en personal, con Seguridad Social. Quedan tres y medio.\nUno en alquiler. Quedan dos y medio.\nLuz, gas, agua, seguros, gestoría: otro euro. Queda uno y medio.\nY ahora Hacienda.\nTe queda un euro. De cada diez."}, {"t": "45-55 s", "b": "EL GIRO", "x": "Si tu cuenta no da eso, no tienes un problema de ventas. Tienes un problema de estructura. Y se arregla."}, {"t": "55-60 s", "b": "CTA", "x": "Escríbeme MI NÚMERO por privado y te mando la plantilla con la que hago esta cuenta."}]}, {"grupo": "Plan 100K · octubre", "id": "G02", "title": "No es subir precios", "meta": ["OCTUBRE - se publica el lunes 5 de octubre a las 11:30", "Duración: 60 s - Pilar: Ingeniería de menú", "Orden de rodaje: 2.º de la sesión"], "cifras": ["8 de cada 10 casos", "Las 3 cosas antes de tocar la carta"], "gancho": "Subir precios no es la solución. Y en ocho de cada diez casos, ni siquiera es el problema.", "nota": "Tono de quien lleva 25 años oyendo lo mismo.", "blocks": [{"t": "3-15 s", "b": "EL REFLEJO", "x": "Cuando alguien me dice que no le salen los números, lo primero que quiere hacer es tocar la carta. Subir un euro aquí, cincuenta céntimos allá. Y casi siempre está tapando otra cosa."}, {"t": "15-30 s", "b": "POR QUE FALLA", "x": "Si subes precios con el escandallo mal hecho, lo único que consigues es perder dinero más despacio. El agujero sigue ahí."}, {"t": "30-50 s", "b": "LAS TRES COSAS", "x": "Antes de tocar un solo precio hay tres cosas que mirar: cuánto te cuesta de verdad cada plato CON LA MERMA DENTRO, cuántas raciones te salen de verdad de cada kilo, y cuánto tiempo de cocina lleva cada plato."}, {"t": "50-60 s", "b": "CIERRE + CTA", "x": "Cuando eso está, a lo mejor ni hace falta subir. Solo dejar de vender lo que te cuesta dinero.\nEn el test de la bio te sale cuál de las ocho áreas te está costando más."}]}, {"grupo": "Plan 100K · octubre", "id": "G03", "title": "El camarero nuevo", "meta": ["OCTUBRE - se publica el lunes 12 de octubre a las 11:30", "Duración: 60 s - Pilar: Personal", "Orden de rodaje: 1.º de la sesión — CALENTAMIENTO"], "cifras": ["2.400 € por reposición", "3 veces al año = 7.000 €"], "gancho": "El camarero nuevo no se va por el sueldo. Se va la segunda semana. Y te cuesta dos mil cuatrocientos euros.", "nota": "Es una historia. Cuéntala, no la recites.", "blocks": [{"t": "3-25 s", "b": "LA ESCENA", "x": "Entra un lunes. Le enseña el que puede, no el que sabe. Nadie le dice qué se espera de él ni cómo se mide si lo está haciendo bien.\nLa primera semana aguanta porque es nuevo. La segunda ya ha entendido que aquí se aprende a base de que te griten cuando fallas.\nY se va."}, {"t": "25-45 s", "b": "LA CUENTA", "x": "Y tú vuelves a publicar la oferta, a hacer entrevistas, a dar de alta, a formar. Entre tu tiempo, lo que rinde de menos el equipo esas semanas, y el alta y la baja: dos mil cuatrocientos euros. Por persona. Pasa tres veces al año y son siete mil."}, {"t": "45-60 s", "b": "CIERRE + CTA", "x": "Un protocolo de siete días cuesta una tarde. Siete mil euros cuestan un año.\nComenta ONBOARDING y te paso el protocolo."}]}, {"grupo": "Plan 100K · octubre", "id": "G04", "title": "Umbral 1 de 8 - Coste de producto", "meta": ["OCTUBRE - se publica el lunes 19 de octubre a las 11:30", "Duración: 90 s - Pilar: Método · serie de 8", "Orden de rodaje: 4.º de la sesión"], "cifras": ["Food cost = (inv. inicial + compras − inv. final) ÷ ventas sin IVA", "UMBRAL 30 %", "30-35 % hay trabajo", "+37 % agujero mensual"], "gancho": "En noventa segundos sé si tu cocina te está robando margen. Solo necesito tres números.", "nota": "Abre la serie de ocho. Tono de quien enseña, no de quien vende.", "blocks": [{"t": "3-20 s", "b": "LOS TRES NÚMEROS", "x": "Compras del mes. Ventas del mes. Inventario de principio y de fin."}, {"t": "20-45 s", "b": "LA FÓRMULA", "x": "Coges lo que compraste, le sumas lo que tenías al principio, le restas lo que te queda al final. Eso es lo que CONSUMISTE de verdad. Y lo divides entre lo que vendiste, sin IVA. Ese número es tu food cost real."}, {"t": "45-70 s", "b": "EL UMBRAL", "x": "El umbral es treinta. Por debajo de treinta, bien. Entre treinta y treinta y cinco, hay trabajo. Por encima de treinta y siete, tienes un agujero y lo estas pagando todos los meses."}, {"t": "70-85 s", "b": "QUÉ HACER", "x": "Y si el número no coincide con lo que dice tu escandallo, ya sabes dónde está: merma, raciones que se van de gramaje, o compras que no controlas."}, {"t": "85-90 s", "b": "CTA", "x": "Treinta por ciento. Apúntatelo. Las otras siete áreas están en el test de la bio."}]}, {"grupo": "Plan 100K · octubre", "id": "G05", "title": "Umbral 2 de 8 - Personal", "meta": ["NOVIEMBRE - se publica el lunes 26 de octubre a las 11:30", "Duración: 90 s - Pilar: Método · serie de 8", "Orden de rodaje: 1.º de la sesión de noviembre"], "cifras": ["Coste total personal ÷ ventas sin IVA", "UMBRAL 32 %"], "gancho": "Si tu personal pasa del treinta y dos por ciento de las ventas, no tienes un problema de plantilla. Tienes un problema de cuadrante.", "nota": "La distinción plantilla/cuadrante es todo el reel.", "blocks": [{"t": "3-25 s", "b": "LA FÓRMULA", "x": "Coge el coste total de personal del mes. Sueldos, Seguridad Social, extras, todo. Divídelo entre las ventas sin IVA. El umbral es treinta y dos."}, {"t": "25-60 s", "b": "EL EJERCICIO", "x": "Y antes de despedir a nadie, haz esto: pon tu venta por franjas de dos horas al lado de tus horas trabajadas por esas mismas franjas. Casi siempre aparece lo mismo: de once a una hay tres personas y entran cuatro mesas. De nueve a once hay tres personas y entran veinte."}, {"t": "60-80 s", "b": "LA CONCLUSIÓN", "x": "No sobra gente. Está mal repartida."}, {"t": "80-90 s", "b": "CTA", "x": "El personal no se recorta. Se cuadra.\nComenta CUADRANTE y te paso la hoja por franjas."}]}, {"grupo": "Plan 100K · octubre", "id": "G06", "title": "Umbral 3 de 8 - Prime cost", "meta": ["NOVIEMBRE - se publica el lunes 2 de noviembre a las 11:30", "Duración: 75 s - Pilar: Método · serie de 8", "Orden de rodaje: 2.º de la sesión de noviembre"], "cifras": ["Food cost + personal ÷ ventas", "UMBRAL 62 %", "+65 % insalvable"], "gancho": "Hay un número que decide si tu restaurante vive o muere. Y casi nadie lo calcula.", "nota": "Promesa fuerte. Cúmplela rápido.", "blocks": [{"t": "3-25 s", "b": "QUÉ ES", "x": "Se llama prime cost. Es la suma de dos cosas que ya tienes: lo que te cuesta el producto y lo que te cuesta el personal. Food cost más coste de personal. Sobre ventas."}, {"t": "25-50 s", "b": "EL UMBRAL", "x": "El umbral es sesenta y dos. Por debajo, el negocio respira. Por encima de sesenta y cinco, ya da igual lo que hagas con el resto: no hay alquiler ni proveedor que te salve."}, {"t": "50-70 s", "b": "POR QUÉ IMPORTA", "x": "Y es el número más útil que existe, porque si uno de los dos se te va, puedes compensar con el otro. Te da margen de maniobra."}, {"t": "70-75 s", "b": "CTA", "x": "Si solo vas a mirar un número al mes, mira este."}]}, {"grupo": "Plan 100K · octubre", "id": "G07", "title": "Umbral 4 de 8 - Alquiler", "meta": ["NOVIEMBRE - se publica el lunes 9 de noviembre a las 11:30", "Duración: 75 s - Pilar: Método · serie de 8", "Orden de rodaje: 3.º de la sesión de noviembre"], "cifras": ["Alquiler ÷ ventas", "UMBRAL 10 %"], "gancho": "Si el alquiler se te come más del diez por ciento, el problema no es la carta.", "nota": "Directo.", "blocks": [{"t": "3-20 s", "b": "LA FÓRMULA", "x": "Alquiler dividido entre ventas. El umbral es diez."}, {"t": "20-40 s", "b": "LA DIFERENCIA", "x": "Y este es distinto a los demas, porque el alquiler no lo puedes bajar mañana. Lo firmaste hace años. Así que solo hay dos salidas: o subes la venta hasta que el alquiler pese menos, o renegocias."}, {"t": "40-65 s", "b": "LA SEGUNDA SALIDA", "x": "Y la segunda se puede. Más de lo que la gente cree. Un local vacío le cuesta dinero al propietario todos los meses, y un inquilino que lleva años pagando puntual tiene más fuerza de la que se imagina. Pero hay que ir con los números en la mano, no con la queja."}, {"t": "65-75 s", "b": "CIERRE", "x": "El alquiler no es un gasto fijo. Es un gasto negociado hace tiempo."}]}, {"grupo": "Plan 100K · octubre", "id": "G08", "title": "«Mi caso es distinto.»", "meta": ["NOVIEMBRE - se publica el lunes 16 de noviembre a las 11:30", "Duración: 70 s - Pilar: Objeciones", "Orden de rodaje: 4.º de la sesión de noviembre"], "cifras": ["200 veces", "Las mismas 3 areas: compras, cuadrante, carta"], "gancho": "«Mi caso es distinto.» Lo he oído doscientas veces. Y en las doscientas, el problema estaba en las mismas tres áreas.", "nota": "Entrecomilla con la voz la primera frase.", "blocks": [{"t": "5-25 s", "b": "LA CONCESIÓN", "x": "Y es verdad que cada restaurante es distinto. El tuyo tiene una carta que no tiene nadie, un equipo que llevas años montando, un barrio con su cosa."}, {"t": "25-45 s", "b": "EL GIRO", "x": "Pero cuando abres los números, la película es siempre la misma. O compras mal, o cuadras mal, o tienes una carta que vende lo que menos te deja. Doscientos restaurantes. Sitios distintos, tamaños distintos, dueños distintos. Y el agujero, en las mismas tres áreas."}, {"t": "45-65 s", "b": "POR QUÉ ES BUENO", "x": "Eso no es malo. Es buenísimo. Porque si el problema fuera único, habría que inventar la solución cada vez. Y no hay que inventarla: ya está inventada."}, {"t": "65-70 s", "b": "CTA", "x": "Tu caso es distinto. Tu problema, probablemente no. Compruébalo: test en la bio."}]}, {"grupo": "Plan 100K · octubre", "id": "G09", "title": "Lo que tiras", "meta": ["DICIEMBRE - se publica el lunes 23 de noviembre a las 11:30", "Duración: 80 s - Pilar: Costes", "Orden de rodaje: 1.º de la sesión de diciembre"], "cifras": ["Merluza 14,80 €/kg", "Rendimiento 60 %", "Coste real 23,87 €/kg", "UMBRAL desperdicio 3 %"], "gancho": "Lo que tiras a la basura también lo has pagado. Y no aparece en ningún sitio.", "nota": "Directo.", "blocks": [{"t": "3-35 s", "b": "LA PRIMERA MERMA", "x": "Hay dos mermas y casi todo el mundo las mezcla. Una es la del producto: la merluza entra a catorce con ochenta el kilo, pero cuando la limpias se te queda en el sesenta por ciento. El kilo que llega al plato te cuesta veintitrés con ochenta y siete. Si tu escandallo dice catorce ochenta, tu escandallo está mal."}, {"t": "35-60 s", "b": "LA SEGUNDA", "x": "La otra es la del día: lo que se cae, lo que se pasa, lo que sale mal y se repite, lo que se come el personal sin contar."}, {"t": "60-75 s", "b": "CÓMO SE MIDE", "x": "La primera se calcula una vez. La segunda hay que apuntarla todos los días durante un mes, y entonces te llevas la sorpresa."}, {"t": "75-80 s", "b": "CTA", "x": "El umbral del desperdicio diario es el tres por ciento. Comenta MERMA y te paso la hoja de control."}]}, {"grupo": "Plan 100K · octubre", "id": "G10", "title": "El caso de los 84.000", "meta": ["DICIEMBRE - se publica el lunes 30 de noviembre a las 11:30", "Duración: 90 s - Pilar: Caso real", "Orden de rodaje: 2.º de la sesión de diciembre"], "cifras": ["Factura 84.000 €/mes", "Se lleva 1.900 €", "Food cost 38 % (debía ser 31) = 6.000 €/mes", "4 h muertas/servicio = 1.900/mes", "70 platos, 12 son el 80 %"], "gancho": "Facturaba ochenta y cuatro mil al mes y se llevaba mil novecientos euros.", "nota": "Deja un segundo de silencio después. Que cale.", "blocks": [{"t": "5-20 s", "b": "LA ESCENA", "x": "Un restaurante lleno. De los de lista de espera el viernes. Ochenta y cuatro mil euros al mes de facturacion. Y el dueño se llevaba mil novecientos."}, {"t": "20-30 s", "b": "EL TRABAJO", "x": "Tardamos tres semanas en encontrar dónde estaba. No era una cosa gorda: eran tres pequeñas."}, {"t": "30-70 s", "b": "LAS TRES", "x": "El food cost estaba en el treinta y ocho, cuando su carta daba para estar en el treinta y uno. Eso son casi seis mil euros al mes.\nEl cuadrante tenía cuatro horas muertas cada servicio, todos los días. Mil novecientos al mes.\nY la carta: setenta platos, de los cuales doce eran el ochenta por ciento de la venta."}, {"t": "70-85 s", "b": "LA MORALEJA", "x": "Ninguna de las tres se veía desde dentro. Porque desde dentro solo ves que el local está lleno."}, {"t": "85-90 s", "b": "CTA", "x": "Estar lleno y ganar dinero son dos cosas distintas. Escríbeme AUDITORÍA si te has reconocido."}]}, {"grupo": "Plan 100K · octubre", "id": "G11", "title": "Tu TPV", "meta": ["DICIEMBRE - se publica el lunes 7 de diciembre a las 11:30", "Duración: 70 s - Pilar: Tecnología", "Orden de rodaje: 3.º de la sesión de diciembre"], "cifras": ["14 meses de datos", "3 informes que ya trae de serie"], "gancho": "Tu TPV lleva catorce meses diciéndote qué plato te arruina. Nadie lo ha leído.", "nota": "Directo.", "blocks": [{"t": "3-20 s", "b": "LO QUE TIENES", "x": "Tienes ahí dentro cada ticket de cada servicio de los últimos años. Qué se vendió, a qué hora, con qué, por cuánto. Y lo usas para cobrar."}, {"t": "20-55 s", "b": "LOS TRES INFORMES", "x": "Con tres informes que ya trae de serie sabrías: qué platos se venden de verdad y cuáles llevan meses ocupando sitio en la carta; a qué horas entra el dinero, que casi nunca es cuando la gente cree; y cómo se mueve tu ticket medio."}, {"t": "55-65 s", "b": "EL REMATE", "x": "No hace falta contratar nada ni instalar nada. Está pagado."}, {"t": "65-70 s", "b": "CTA", "x": "Comenta TPV y te digo exactamente los tres informes que hay que sacar."}]}, {"grupo": "Plan 100K · octubre", "id": "G12", "title": "«En enero me pongo.»", "meta": ["DICIEMBRE - se publica el lunes 14 de diciembre a las 11:30", "Duración: 70 s - Pilar: Objeciones · cierre de año", "Orden de rodaje: 4.º de la sesión de diciembre"], "cifras": ["4 puntos de margen", "50.000 €/mes → 2.000 €/mes", "3 meses = 6.000 €"], "gancho": "Si llevas tres meses diciendo «en enero me pongo», esto es para ti.", "nota": "Sin reproche. Tono de entender, no de regañar.", "blocks": [{"t": "5-30 s", "b": "LA EMPATÍA", "x": "Lo entiendo. El día a día se come todo. Abres, sirves, cierras, haces pedidos, cubres una baja, y cuando quieres mirar los números son las doce de la noche y no tienes cuerpo."}, {"t": "30-55 s", "b": "LA CUENTA", "x": "Pero hay una cuenta que conviene hacer. Si se te están yendo cuatro puntos de margen y facturas cincuenta mil al mes, son dos mil euros. Cada mes que pasa. Tres meses de «ya lo miraré» son seis mil euros."}, {"t": "55-65 s", "b": "EL REMATE", "x": "Eso no es dejarlo para enero. Eso es pagar seis mil euros por no mirarlo."}, {"t": "65-70 s", "b": "CTA", "x": "No hace falta arreglarlo hoy. Hace falta saber cuánto te cuesta no arreglarlo. Test en la bio."}]}, {"grupo": "Julio · talking heads", "id": "J1", "title": "Me escribió un hostelero (cap. 1)", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Me escribió un hostelero. Dos meses abierto y ya devuelve platos.", "nota": "", "blocks": [{"t": "", "b": "LECTURA, leyendo el móvil de verdad", "x": "Un local de brunch en Zaragoza. Me dice: la organización es fatal, los platos no salen, nos los devuelven. Y somos cinco: tres en cocina, dos en barra."}, {"t": "", "b": "RESPUESTA, a cámara", "x": "Pues os voy a decir una cosa: esto no es un problema de personal, es un problema de pase. Cinco personas para un brunch dan de sobra. Pero si nadie ha definido quién canta la comanda, quién monta y quién saca el plato, da igual que metas una sexta: la mesa cuatro seguirá esperando sus huevos. El pase se define con la carta delante, en una hora. Una hora."}, {"t": "", "b": "REMATE + CTA", "x": "Dos meses abierto no es tu problema. Dos meses sin pase, sí. Si tienes un local y quieres que responda el tuyo, cuéntamelo por DM."}]}, {"grupo": "Julio · talking heads", "id": "J2", "title": "La carta que pierde dinero", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Tu plato estrella puede ser el que más dinero te hace perder.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Pusiste los precios hace un año. Desde entonces ha subido el aceite, la carne, la luz... y tu carta sigue igual. Con los costes de hoy, cada plato te deja menos y alguno ya te cuesta más de lo que cobras por él. El que más sale es el estrella. Por lo cual, el plato que más vendes es el que más veces te repite esa pérdida."}, {"t": "", "b": "PAYOFF", "x": "La carta se revisa cuando el género se mueve, no cuando te apetece. Coge tus cinco platos más vendidos y hazles el escandallo esta semana: es una tarde de trabajo."}, {"t": "", "b": "REMATE + CTA", "x": "Precios del año pasado con costes de hoy: esa es la cuenta que te come el margen. Sígueme, que de números hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J3", "title": "Facturas 40.000 € y no te pagas nómina", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Facturas cuarenta mil euros al mes y no te estás pagando una nómina.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Y no eres el único: esto lo veo cada semana. La caja entra, el local se llena, cobra todo el mundo... menos tú. ¿Y dónde está ese dinero? Casi siempre en tres sitios: en el género que compras sin escandallo, en la merma que nadie apunta y en dos o tres platos que vendes por debajo de lo que te cuestan. Entre esas tres cosas se van dos mil, tres mil euros al mes. Sin que nadie te robe nada."}, {"t": "", "b": "REMATE + CTA", "x": "El dinero no se te va de un golpe: se te va en un goteo que nadie está mirando. Esta semana, apunta la merma. Solo eso. Y sígueme, que de esto hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J4", "title": "Dos locales de Bilbao", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Dos locales en Bilbao: uno factura el doble... y el otro gana el doble.", "nota": "", "blocks": [{"t": "", "b": "BUILD — cifras tuyas: reales, redondas, en horquilla si dudas", "x": "Os voy a poner un ejemplo real, sin nombres. El primero factura [CIFRA: p. ej. dos millones] al año: local lleno, terraza llena, [CIFRA: veintidós, veinticinco] personas de plantilla. El segundo factura la mitad con [CIFRA: diez, doce]. Y sin embargo, a final de año, el pequeño se lleva a casa casi el doble que el grande. ¿Por qué? Porque el grande tapa el caos metiendo horas y gente, y el pequeño tiene tres números controlados: lo que cuesta cada plato, lo que cuesta cada hora de trabajo y lo que deja cada mesa."}, {"t": "", "b": "REMATE + CTA", "x": "La facturación se ve desde la calle. El margen se ve en el banco. Guárdate este vídeo para el día que te plantees abrir el segundo local."}]}, {"grupo": "Julio · talking heads", "id": "J5", "title": "La queja", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "", "nota": "", "blocks": [{"t": "", "b": "NEGACIÓN EN SERIE, hook", "x": "Nadie te clava una reseña de una estrella por un filete pasado. Ni por una comanda que tarda, ni porque el camarero nuevo se equivoque de mesa. Te la clavan por lo que hiciste después."}, {"t": "", "b": "GIRO", "x": "Porque el error no lo eliges, pero la respuesta sí. El cliente no recuerda el filete: recuerda si alguien fue a la mesa, le miró a la cara y se lo arregló."}, {"t": "", "b": "REGLA", "x": "Por eso la regla en mi casa es esta: la queja se atiende antes que la comanda. Siempre. El que se queja te da la oportunidad de arreglarlo. El que no se queja no vuelve, y lo cuenta en Google."}, {"t": "", "b": "REMATE + CTA", "x": "La queja bien atendida es la mejor mesa del día. Enséñale este vídeo a tu equipo antes del servicio."}]}, {"grupo": "Julio · talking heads", "id": "J6", "title": "El primer minuto", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "La reseña de esta noche se decide en el primer minuto, antes de que salga un solo plato.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Un cliente entra y en sesenta segundos pasan tres cosas: alguien le mira o nadie le mira, alguien le dice \"ahora te atiendo\" o le deja plantado, y alguien le sienta bien o le suelta en la peor mesa. Todavía no ha probado nada y ya ha decidido con qué ojos va a mirar todo lo demás. Si ese minuto es bueno, te perdona que la comanda tarde. Si es malo, el mejor solomillo llega a una mesa que ya está en contra."}, {"t": "", "b": "REGLA + REMATE + CTA", "x": "Y esto no es simpatía: es sistema. Quién recibe, qué dice y cuánto tarda. Se entrena antes del servicio, en cinco minutos. El cliente decide en la puerta y lo justifica con la comida. Guárdate este vídeo para la reunión de equipo."}]}, {"grupo": "Julio · talking heads", "id": "J7", "title": "Servicio vs hospitalidad en un menú de 14 €", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "El menú de catorce euros no compite en precio. Compite en cómo tratas a la gente.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Porque servicio y hospitalidad no son lo mismo. Servicio es traer el plato caliente y a tiempo: eso lo hace cualquiera que haga bien su trabajo. Hospitalidad es que el cliente sienta que le estaban esperando: que le llames por su nombre, que te acuerdes de que no toma gluten, que le guardes su mesa de siempre. En tu calle todos dan de comer por catorce euros. El que llena todos los días no es el más barato: es aquel donde te reciben como a alguien de casa."}, {"t": "", "b": "REGLA + REMATE + CTA", "x": "La regla es simple: cada mesa, un gesto. Uno. El plato lo paga el cliente. El gesto te lo devuelve la fidelidad. Sígueme, que de esto hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J8", "title": "El ratio de personal que casi todos calculan mal", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "El ratio de personal de tu local está mal calculado. Casi seguro.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Y te digo por qué: porque estás metiendo tu sueldo de gestión dentro. Y la gestión no es coste de personal, es otra partida. Para saber si tu plantilla está bien dimensionada, la cuenta es esta: plantilla más extras, dividido entre lo que vendes. Solo eso. Con la gestión dentro, el número te sale inflado y tomas decisiones equivocadas: recortas camareros cuando el problema está en otro sitio."}, {"t": "", "b": "CIFRA", "x": "Y una referencia para situarte: en torno al treinta por ciento, respiras. Por encima del treinta y cinco, tienes un problema que no se arregla metiendo más horas tú."}, {"t": "", "b": "REMATE + CTA", "x": "Haz la cuenta esta semana con los números del mes pasado. Plantilla más extras, entre lo vendido. Y guárdate este vídeo para hacerla."}]}, {"grupo": "Julio · talking heads", "id": "J9", "title": "Me escribió un hostelero (cap. 2): queremos aumentar ventas", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Me escribió un hostelero. Tres palabras: queremos aumentar ventas.", "nota": "", "blocks": [{"t": "", "b": "LECTURA, leyendo el móvil", "x": "Un asador familiar en Burgos. Me dice: el local va bien de gente, pero no llegamos. Queremos aumentar ventas. ¿Hacemos publicidad?"}, {"t": "", "b": "RESPUESTA, a cámara", "x": "Pues os voy a decir una cosa: antes de meter un euro en publicidad, mira cuánto te queda de lo que ya vendes. Porque si tu margen está roto, vender más es repetir la pérdida más veces. Un local lleno que no llega a fin de mes no tiene un problema de ventas: tiene un problema de escandallo, de merma o de horas. Primero se arregla la cuenta de dentro. Después, y solo después, se llena más el comedor."}, {"t": "", "b": "REMATE + CTA", "x": "Querer vender más no es un plan. Saber cuánto te deja cada venta, sí. Si tienes un local y quieres que responda el tuyo, cuéntamelo por DM."}]}, {"grupo": "Julio · talking heads", "id": "J10", "title": "El mes que descubrí 1.200 € de merma (confesional)", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Un mes descubrí mil doscientos euros de merma en mi propia cocina. Mía. Con veinte años de oficio.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Y no era robo, ni un desastre de cámara. Era el goteo de siempre: el perejil que se seca, la nata abierta del viernes, el pan que sobra, la ración que se monta grande. Nada de eso sale en ninguna cuenta, pero lo había pagado yo. ¿Cómo lo descubrí? Con un cuaderno en cocina: todo lo que se tira, apuntado con producto y cantidad. La primera semana ya dolía. Al mes, mil doscientos euros."}, {"t": "", "b": "REMATE + CTA", "x": "Lo que se tira no aparece en ninguna factura, pero lo has pagado tú. Pon el cuaderno esta semana y luego me cuentas. Sígueme, que de esto hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J11", "title": "Proveedores: la culpa era mía", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Llevaba años pagando de más a mis proveedores. Y la culpa no era suya: era mía.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Porque nunca comparaba. Al proveedor de toda la vida no se le discute, se le paga. Hasta que un día pedí precio del mismo género a otros dos... y el mismo lomo tenía tres precios distintos en la misma calle. Desde entonces, dos reglas: dos proveedores por familia de producto, siempre. Y los precios se revisan cada temporada, no cuando me acuerdo. Y ojo, esto no es pelearse con nadie: es preguntar. En carne y pescado, un cinco por ciento de la compra son cientos de euros al mes."}, {"t": "", "b": "REMATE + CTA", "x": "Esta semana, pide precio a un segundo proveedor de tu partida más gorda. Con eso empiezas. Sígueme, que de números hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J12", "title": "Tres cierres de caja sin saber si ganaste", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Tres cierres de caja seguidos sin saber si habías ganado dinero. Yo he estado ahí.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Porque la caja llena engaña. La caja te dice cuánto entró, no cuánto ganaste. Hasta que no le restas el género, las nóminas, el alquiler y la luz, ese montón de billetes no significa nada. Y esa cuenta casi nadie la hace a diario. La solución cabe en un papel: cada noche, cuatro números. Lo vendido, lo comprado hoy, las horas trabajadas y una línea de incidencias. Cinco minutos con el local ya cerrado."}, {"t": "", "b": "REMATE + CTA", "x": "Un mes con ese papel y sabrás de tu negocio más que en el último año entero. Guárdate este vídeo para el cierre de esta noche."}]}, {"grupo": "Julio · talking heads", "id": "J13", "title": "Chick-fil-A cierra los domingos", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "La cadena de pollo más rentable de Estados Unidos cierra todos los domingos. Y aun así vende más por local que McDonald's.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Se llama Chick-fil-A. Cierra uno de cada siete días y factura por restaurante más que nadie. ¿Y cómo puede ser? Equipos que descansan, gente que no se va, servicio que no falla. La rotación baja se paga sola. ¿Y qué copiaría yo para un bar de aquí? No el cerrar en domingo: el proteger el descanso. Cuadrantes que se cumplen, dos días seguidos de libranza cuando se pueda, y el festivo trabajado, devuelto."}, {"t": "", "b": "REMATE + CTA", "x": "Un equipo descansado te vende más que una hora extra. Guárdalo para cuando hagas el cuadrante de agosto."}]}, {"grupo": "Julio · talking heads", "id": "J14", "title": "Mercadona: cuatro semanas antes de tocar caja", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Mercadona no deja a nadie tocar una caja sin cuatro semanas de formación. En hostelería metemos al nuevo un viernes por la noche.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Y luego nos quejamos de que el chaval falla. Pues claro que falla: nadie le ha enseñado la carta, ni las mesas, ni el TPV, ni quién manda en el pase. Y cada fallo suyo lo paga tu servicio entero: comandas mal metidas, ritmo roto, cliente quemado. No te hacen falta cuatro semanas como a Mercadona. Te hacen falta dos días con método: un día de carta y TPV, un día de sala pegado al mejor que tengas."}, {"t": "", "b": "REMATE + CTA", "x": "El nuevo no te sale caro por su nómina: te sale caro sin formar. Guárdalo para la próxima incorporación."}]}, {"grupo": "Julio · talking heads", "id": "J15", "title": "La pregunta del cajero de Trader Joe's", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Hay un supermercado americano donde el cajero te pregunta qué vas a cenar. Y esa pregunta vale millones.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Se llama Trader Joe's, y entrena a su gente para conversar en caja: qué plan tienes, prueba esto con aquello. No es simpatía: es una pregunta diseñada, entrenada y repetida. ¿Y la versión de un restaurante de aquí? El camarero que pregunta \"¿lo queréis para compartir?\" o \"¿os saco unas croquetas mientras miráis la carta?\". Una pregunta por puesto, decidida antes del servicio. No diez: una."}, {"t": "", "b": "REMATE + CTA", "x": "Una pregunta bien entrenada factura más que la pizarra de ofertas. Decide la de tu casa hoy en el briefing y enséñale este vídeo a tu equipo."}]}, {"grupo": "Julio · talking heads", "id": "J16", "title": "La cuenta de una baja", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Cada camarero que se te va te cuesta más de mil euros. Aunque no lo veas en ninguna factura.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Haz la cuenta conmigo: el anuncio y las entrevistas, tus horas. Las semanas de rodaje a medio ritmo. Los errores del nuevo, que los paga el cliente. Y el equipo, cargando el hueco mientras tanto. En España la rotación en hostelería pasa del sesenta por ciento: es la sangría más cara del oficio y no sale en ningún papel. Y retener no siempre es pagar más: es cuadrante estable, descanso que se respeta y saber a quién respondes."}, {"t": "", "b": "REMATE + CTA", "x": "Sustituir es más caro que cuidar. Guárdate este vídeo para la próxima vez que pienses \"ya vendrá otro\"."}]}, {"grupo": "Julio · talking heads", "id": "J17", "title": "La escena de The Bear que explica el pase", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Hay una escena de The Bear que explica el pase mejor que cualquier curso. Te la cuento.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "La cocina es un caos: gritos, platos que vuelven, todo el mundo corriendo y nadie avanzando. ¿Y qué lo arregla? No es correr más. Es que cada uno tenga su puesto y una sola voz cante la comanda. Oído. Y eso no es cosa de estrellas Michelin: en un bar de menús pasa igual. Quién canta la comanda, quién monta el plato, quién lo saca. Tres papeles con nombre. Cuando eso existe, el mismo equipo que ayer se gritaba, hoy fluye."}, {"t": "", "b": "REMATE + CTA", "x": "Veinte años de pase me han enseñado lo mismo que esa escena: el caos no se arregla corriendo, se arregla cantando. Sígueme, que de esto hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J18", "title": "El cliente difícil no se gestiona con paciencia", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "El cliente difícil no se gestiona con paciencia. Se gestiona con sistema.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Porque tu camarero nuevo no puede improvisar delante de uno que viene a discutir. En mi casa la regla tiene tres pasos y se sabe antes del servicio. Uno: se escucha entero, sin interrumpir y sin justificarse. Dos: si la cosa sube, va el de los galones: el encargado o el dueño, no el chaval. Y tres: el equipo sabe hasta dónde puede decidir. Si puede invitar a un café para cerrar un mal trago, que lo sepa antes del servicio, no durante."}, {"t": "", "b": "REMATE + CTA", "x": "Al difícil no se le gana discutiendo: se le gana teniendo un plan. Enséñale este vídeo a tu equipo antes del próximo turno."}]}, {"grupo": "Julio · talking heads", "id": "J19", "title": "Tu local no falla por malo: falla por irregular", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Tu local no está fallando por malo. Está fallando por irregular.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "El martes bordas el servicio y el viernes se te cae. Y el cliente no vuelve al sitio del martes: deja de volver por el viernes. La regularidad no es suerte, se fabrica con tres cosas: ficha de cada plato, para que salga igual lo haga quien lo haga. Pase definido, para que el ritmo no dependa de quién trabaje hoy. Y briefing de cinco minutos antes de cada servicio. Lo brillante trae la primera visita; lo regular trae todas las demás."}, {"t": "", "b": "REMATE + CTA", "x": "No busques el mejor servicio de tu vida: busca el mismo servicio todos los días. Sígueme, que de esto hablo todos los días."}]}, {"grupo": "Julio · talking heads", "id": "J20", "title": "Tu mejor camarero no se va por el sueldo", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Tu mejor camarero no se va por el sueldo. Se va por aguantar al que trabaja mal a su lado.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Piénsalo: el bueno llega puntual, saca sus mesas y encima tapa los agujeros del flojo. Y si al flojo no le pasa nada, el mensaje que recibe el bueno es que aquí da igual hacerlo bien. Cada turno que el flojo sale gratis, el bueno actualiza el currículum. Pedir cuentas no es montar una bronca: es que el trabajo mal hecho tenga una conversación esa misma semana. A solas, con hechos y con fecha para corregirlo."}, {"t": "", "b": "REMATE + CTA", "x": "Al bueno se le cuida pidiéndole cuentas al flojo. Guárdate este vídeo para antes de hacer el próximo cuadrante."}]}, {"grupo": "Julio · talking heads", "id": "J21", "title": "El asador que bajó personal del 38 al 31", "meta": ["Sesión de julio, aprobado 27-jul-2026"], "cifras": [], "gancho": "Un asador bajó su gasto de personal del treinta y ocho al treinta y uno por ciento de la venta. Sin despedir a nadie.", "nota": "", "blocks": [{"t": "", "b": "BUILD", "x": "Un caso real del norte. ¿Y cuál fue la palanca? No fue echar gente: fue cuadrar horas con venta. Cuadrantes por franjas, porque no necesitas el mismo equipo un martes a las cinco que un sábado a las dos. Extras solo cuando hay reserva que los pague. Y la gestión, fuera del ratio, que esa es otra partida. Siete puntos sobre la venta, en un local normal, son decenas de miles de euros al año. Sin tocar la calidad y sin quemar a nadie."}, {"t": "", "b": "REMATE + CTA", "x": "El personal no se recorta: se cuadra. Guárdate este vídeo para hacer tus cuadrantes por franjas."}]}];
const $ = id => document.getElementById(id);
const scroll = $("scroll"), text = $("text");
let cur = 0, playing = false, speed = 1.0, fs = 34, mirror = false, showCif = true, raf = null, last = 0, acc = 0;
const load = (k, d) => { try { const v = localStorage.getItem("tp_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem("tp_" + k, JSON.stringify(v)); } catch (e) {} };
speed = load("speed", 1.0); fs = load("fs", 34); mirror = load("mirror", false); showCif = load("cif", true); cur = Math.min(load("cur", 0), G.length - 1);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function fillSel() {
  let g = null, html = "";
  G.forEach((s, i) => { if (s.grupo !== g) { if (g) html += "</optgroup>"; g = s.grupo; html += '<optgroup label="' + esc(g) + '">'; } html += '<option value="' + i + '">' + esc(s.id + " · " + s.title) + "</option>"; });
  html += "</optgroup>"; $("sel").innerHTML = html;
}
function render() {
  const s = G[cur]; let h = "";
  h += '<div class="meta">' + esc(s.id + " · " + s.title) + (s.meta.length ? "<br>" + esc(s.meta.join(" · ")) : "") + "</div>";
  if (showCif && s.cifras.length) h += '<div class="cifras">' + s.cifras.map(c => "<span>" + esc(c) + "</span>").join("") + "</div>";
  if (s.gancho) h += '<span class="lbl">Gancho</span><p class="gancho">' + esc(s.gancho) + "</p>";
  s.blocks.forEach(b => { h += '<span class="lbl">' + esc((b.t ? b.t + " · " : "") + b.b) + "</span><p>" + esc(b.x) + "</p>"; });
  h += '<p class="fin">Fin · ' + esc(s.id) + "</p>";
  text.innerHTML = h; text.style.setProperty("--fs", fs + "px"); text.classList.toggle("mirror", mirror);
  $("sel").value = cur; scroll.scrollTop = 0; save("cur", cur);
  $("vv").textContent = speed.toFixed(1).replace(".", ","); $("fv").textContent = fs;
  $("mirror").classList.toggle("on", mirror); $("cif").classList.toggle("on", showCif);
}
function step(ts) {
  if (!playing) return;
  if (last) { acc += (ts - last) / 1000 * speed * 55; const px = Math.floor(acc); if (px) { scroll.scrollTop += px; acc -= px; } }
  last = ts;
  if (scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 2) { setPlay(false); return; }
  raf = requestAnimationFrame(step);
}
function setPlay(p) { playing = p; last = 0; acc = 0; $("play").classList.toggle("on", p); $("play").innerHTML = p ? "&#10074;&#10074;&nbsp; Pausa" : "&#9654;&nbsp; Empezar"; if (p) raf = requestAnimationFrame(step); else if (raf) cancelAnimationFrame(raf); }
function go(i) { setPlay(false); cur = (i + G.length) % G.length; render(); }
$("play").onclick = () => setPlay(!playing);
scroll.addEventListener("click", () => setPlay(!playing));
$("vm").onclick = () => { speed = Math.max(0.2, +(speed - 0.1).toFixed(1)); save("speed", speed); $("vv").textContent = speed.toFixed(1).replace(".", ","); };
$("vp").onclick = () => { speed = Math.min(4, +(speed + 0.1).toFixed(1)); save("speed", speed); $("vv").textContent = speed.toFixed(1).replace(".", ","); };
$("fm").onclick = () => { fs = Math.max(18, fs - 2); save("fs", fs); text.style.setProperty("--fs", fs + "px"); $("fv").textContent = fs; };
$("fp").onclick = () => { fs = Math.min(72, fs + 2); save("fs", fs); text.style.setProperty("--fs", fs + "px"); $("fv").textContent = fs; };
$("top").onclick = () => { setPlay(false); scroll.scrollTop = 0; };
$("mirror").onclick = () => { mirror = !mirror; save("mirror", mirror); text.classList.toggle("mirror", mirror); $("mirror").classList.toggle("on", mirror); };
$("cif").onclick = () => { showCif = !showCif; save("cif", showCif); render(); };
$("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
$("sel").onchange = e => go(+e.target.value);
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); setPlay(!playing); } if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); if (e.key === "ArrowUp") $("vp").click(); if (e.key === "ArrowDown") $("vm").click(); });
let wl = null; async function lock() { try { if (navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch (e) {} }
document.addEventListener("click", lock, { once: true }); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") lock(); });
fillSel(); render();
</script>
